kafka:
  producer:
    brokers:
      - "kafka:29092"
    client_id: dummy-async-producer
    topic: scrape.responses
  producers:
    scrape.errors:
      brokers:
        - "kafka:29092"
      client_id: dummy-async-errors-producer
      topic: scrape.errors
  consumer:
    brokers:
      - "redpanda:9092"
    group_id: ${oc.env:HOSTNAME,dummy-async-consumer}
    topics:
      - "scrape.requests"
    auto_offset_reset: latest

streaming:
  smoke:
    api_base: https://dummyjson.com
    async_timeout_s: 30.0
    async_max_concurrency: 50
    async_batch_max_records: 50
    async_batch_timeout_ms: 2000
    fetch_request:
      api_base: https://dummyjson.com
      timeout_s: 30.0
  observability:
    log:
      enabled: true
      config:
        name: dummy_loom_streaming
        environment: ${oc.env:ENVIRONMENT,dev}
        renderer: ${oc.env:LOG_RENDERER,console}
        colors: ${oc.decode:${oc.env:LOG_COLORS,true}}
        level: ${oc.env:LOG_LEVEL,INFO}
    otel:
      enabled: true
      export_logs: true
      config:
        service_name: ${oc.env:OTEL_SERVICE_NAME,dummy-async-pod}
        tracer_name: dummy-loom-streaming
        endpoint: ${oc.env:OTEL_EXPORTER_OTLP_ENDPOINT,http://otel-lgtm:4318/v1/traces}
        protocol: ${oc.env:OTEL_EXPORTER_OTLP_PROTOCOL,http/protobuf}
    prometheus:
      enabled: ${oc.decode:${oc.env:PROMETHEUS_ENABLED,false}}
      config:
        path: ${oc.env:PROMETHEUS_PATH,/metrics}

httpx:
  config:
    timeout_s: 30.0
    max_connections: 50
    max_keepalive_connections: 20
