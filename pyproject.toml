[project]
name = "dummy-loom-streaming"
version = "0.1.0"
description = "Dummy streaming repo built on loom-kernel with Bytewax/Kafka runners"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "loom-kernel[streaming]==0.5.0",
    "httpx>=0.28,<1.0",
    "msgspec>=0.18,<1.0",
    "structlog>=24.4,<26.0",
    "omegaconf>=2.3,<3.0",
    "fsspec>=2024.2.0",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smoke"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple"

[tool.uv.sources]
loom-kernel = { index = "pypi" }

[tool.uv.pip]
index-strategy = "unsafe-best-match"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-p no:loom-spark"
